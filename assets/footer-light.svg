<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-label="Footer"><title>Footer</title><style>
text{font-family:Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
.m{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes floatb{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
@keyframes shimmer{0%{opacity:.55}50%{opacity:1}100%{opacity:.55}}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.ring{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes sweep{from{transform:translateX(-400px)}to{transform:translateX(1200px)}}.sw{animation:sweep 5s linear infinite}</style>
<defs><linearGradient id="s" x1="0" x2="1"><stop offset="0" stop-color="#7c3aed" stop-opacity="0"/><stop offset=".5" stop-color="#7c3aed"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></linearGradient>
<clipPath id="k"><rect x="0" y="20" width="1200" height="2"/></clipPath></defs>
<rect x="0" y="20" width="1200" height="1.2" fill="#e4e2ef"/>
<g clip-path="url(#k)"><rect class="sw" x="0" y="20" width="400" height="2" fill="url(#s)"/></g>
<text x="600" y="62" font-size="15" fill="#6b6b7d" text-anchor="middle">Designed &amp; coded with care by <tspan fill="#17171f" font-weight="600">Refina Kusuma</tspan></text>
<text class="m" x="600" y="88" font-size="12" fill="#6b6b7d" text-anchor="middle" opacity=".8">thanks for stopping by ✦</text>
</svg>