<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="48" viewBox="0 0 1200 48" role="img" aria-label="Activity"><title>Activity</title><style>
text{font-family:Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
.m{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes floatb{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
@keyframes shimmer{0%{opacity:.55}50%{opacity:1}100%{opacity:.55}}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.ring{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

@keyframes draw{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
.ln{stroke-dasharray:1200;animation:draw 1.6s ease-out both .2s}
</style>
<rect x="0" y="12" width="4" height="24" rx="2" fill="#7c3aed"/>
<text class="m" x="18" y="31" font-size="14" fill="#7c3aed" font-weight="700">04</text>
<text x="56" y="33" font-size="22" font-weight="650" fill="#17171f" letter-spacing="-.3">Activity</text>
<line class="ln" x1="182" y1="24" x2="1200" y2="24" stroke="#e4e2ef" stroke-width="1.2"/>
</svg>