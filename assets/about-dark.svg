<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-label="About me"><title>About me</title><style>
text{font-family:Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
.m{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes floatb{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
@keyframes shimmer{0%{opacity:.55}50%{opacity:1}100%{opacity:.55}}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.ring{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs>
<g class="rise" style="animation-delay:0.05s"><rect x="0" y="0" width="720" height="210" rx="18" fill="#12121a" stroke="#252533"/><text class="m" x="30" y="44" font-size="12" fill="#8d8da0" letter-spacing="1.5">ABOUT</text><text x="30" y="96" font-size="30" font-weight="700" fill="#ececf1" letter-spacing="-.5">Designing &amp; building</text><text x="30" y="136" font-size="30" font-weight="700" letter-spacing="-.5"><tspan fill="url(#g)">aesthetic</tspan><tspan fill="#ececf1" dx="9">web experiences.</tspan></text><text x="30" y="176" font-size="15" fill="#8d8da0">I bridge UI/UX design and frontend code, turning ideas into real interfaces.</text></g>
<g transform="translate(740,0)"><g class="rise" style="animation-delay:0.15s"><rect x="0" y="0" width="460" height="210" rx="18" fill="#12121a" stroke="#252533"/><text class="m" x="30" y="44" font-size="12" fill="#8d8da0" letter-spacing="1.5">FOCUS</text><rect x="30" y="74" width="65" height="30" rx="15" fill="#181824" stroke="#252533"/><text x="63" y="94" font-size="14" fill="#ececf1" text-anchor="middle">UI/UX</text><rect x="105.2" y="74" width="136" height="30" rx="15" fill="#181824" stroke="#252533"/><text x="173" y="94" font-size="14" fill="#ececf1" text-anchor="middle">Responsive Web</text><rect x="250.95999999999998" y="74" width="128" height="30" rx="15" fill="#181824" stroke="#252533"/><text x="315" y="94" font-size="14" fill="#ececf1" text-anchor="middle">Design System</text><text x="30" y="136" font-size="14" fill="#8d8da0">Clean interfaces, consistent systems,</text><text x="30" y="158" font-size="14" fill="#8d8da0">and smooth responsive behavior.</text></g></g>
<g transform="translate(0,230)"><g class="rise" style="animation-delay:0.25s"><rect x="0" y="0" width="380" height="150" rx="18" fill="#12121a" stroke="#252533"/><text class="m" x="30" y="44" font-size="12" fill="#8d8da0" letter-spacing="1.5">NOW</text><circle cx="36" cy="82" r="5" fill="#a78bfa"/><circle class="ring" cx="36" cy="82" r="5" fill="#a78bfa"/><text x="52" y="88" font-size="18" font-weight="600" fill="#ececf1">Building projects</text><text class="m" x="30" y="122" font-size="13" fill="#8d8da0">learning · <tspan fill="#a78bfa">Next.js · Tailwind CSS</tspan></text></g></g>
<g transform="translate(400,230)"><g class="rise" style="animation-delay:0.35s"><rect x="0" y="0" width="390" height="150" rx="18" fill="#12121a" stroke="#252533"/><text class="m" x="30" y="44" font-size="12" fill="#8d8da0" letter-spacing="1.5">BASED IN</text><path d="M38 70 c-9 0 -15 7 -15 15 c0 11 15 24 15 24 s15 -13 15 -24 c0 -8 -6 -15 -15 -15 z" fill="none" stroke="#a78bfa" stroke-width="2"/><circle cx="38" cy="85" r="5" fill="#a78bfa"/><text x="66" y="92" font-size="18" font-weight="600" fill="#ececf1">Yogyakarta, Indonesia</text><text class="m" x="30" y="128" font-size="13" fill="#8d8da0">UTC+07:00</text></g></g>
<g transform="translate(810,230)"><g class="rise" style="animation-delay:0.45s"><rect x="0" y="0" width="390" height="150" rx="18" fill="#12121a" stroke="#252533"/><text class="m" x="30" y="44" font-size="12" fill="#8d8da0" letter-spacing="1.5">OPEN FOR</text><text x="30" y="90" font-size="18" font-weight="600" fill="#ececf1">Collaboration</text><text class="m" x="30" y="122" font-size="13" fill="#8d8da0">design × code projects</text></g></g>
</svg>