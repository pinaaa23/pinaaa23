<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="110" viewBox="0 0 1000 110" role="img" aria-label="04 / Connection Protocol" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>04 / Connection Protocol</title>
<style>
text{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
.h{font-size:13px;fill:#a78bfa;letter-spacing:2px}
.s{font-size:11px;fill:#77718c;letter-spacing:1.4px}
.win{animation:win .6s cubic-bezier(.2,.7,.2,1) both}
.cur{opacity:0;animation:blink 1s steps(1) .8s infinite}
@keyframes win{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g class="win">
  <rect x=".5" y=".5" width="999" height="109" rx="18" fill="#08080d" stroke="#2c2644"/>
  <rect x="32" y="30" width="3" height="50" rx="1.5" fill="#a78bfa"/>
  <text class="h" x="52" y="50">04 / CONNECTION.PROTOCOL</text>
  <text class="s" x="52" y="74">OPEN CHANNELS · LET'S BUILD SOMETHING</text>
  <rect class="cur" x="400" y="64" width="7" height="13" fill="#a78bfa"/>
</g>
</svg>
