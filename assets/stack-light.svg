03" y="86" font-size="14" fill="#17171f" text-anchor="middle">React.js</text><rect x="30" y="108" width="81" height="30" rx="15" fill="#f3f1fb" stroke="#e4e2ef"/><text x="70" y="128" font-size="14" fill="#17171f" text-anchor="middle">Next.js</text><rect x="120.88" y="108" width="120" height="30" rx="15" fill="#f3f1fb" stroke="#e4e2ef"/><text x="181" y="128" font-size="14" fill="#17171f" text-anchor="middle">Tailwind CSS</text></g></g><g transform="translate(820,0)"><g class="rise" style="animation-delay:0.29s"><rect x="0" y="0" width="380" height="184" rx="18" fill="#ffffff" stroke="#e4e2ef"/><text class="m" x="30" y="44" font-size="12" fill="#6b6b7d" letter-spacing="1.5">TOOLS</text><rect x="326" y="30" width="24" height="3" rx="1.5" fill="#7c3aed"/><rect x="30" y="66" width="120" height="30" rx="15" fill="#f3f1fb" stroke="#e4e2ef"/><text x="90" y="86" font-size="14" fill="#17171f" text-anchor="middle">Git / GitHub</text><rect x="160.08" y="66" width="81" height="30" rx="15" fill="#f3f1fb" stroke="#e4e2ef"/><text x="201" y="86" font-size="14" fill="#17171f" text-anchor="middle">VS Code</text><rect x="250.96" y="66" width="81" height="30" rx="15" fill="#f3f1fb" stroke="#e4e2ef"/><text x="291" y="86" font-size="14" fill="#17171f" text-anchor="middle">Webpack</text><rect x="30" y="108" width="73" height="30" rx="15" fill="#f3f1fb" stroke="#e4e2ef"/><text x="67" y="128" font-size="14" fill="#17171f" text-anchor="middle">Vercel</text><rect x="113.04" y="108" width="81" height="30" rx="15" fill="#f3f1fb" stroke="#e4e2ef"/><text x="153" y="128" font-size="14" fill="#17171f" text-anchor="middle">Postman</text></g></g></svg>